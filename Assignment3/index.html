<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODING CLUB</title>
    <link rel=""
</head>
<body>
     <nav><a href="/events">Events</a> |
         <a href="/register">Register</a></nav> 
      <h1>Coding Club</h1>
       <h2>Upcoming Events</h2>
         <table border="1">
             <caption>Club Events</caption>
             <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>
            <tbody>
                 <tr>
                    <td>HTML Workshop</td>
                    <td>12 Nov</td>
                    <td>Lab 1</td>
                </tr>
                <tr>
                    <td>Hackathon</td>
                    <td>20 Nov</td>
                    <td>Seminar Hall</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total events: 2</td>
                </tr> <br>
            </tfoot>
    </table>
  <h2> Register</h2>
  <form>
<label for="name">Name:</label>
<input type="text" id="name" name="name" placeholder="Enter your Name" required>
<br> <br>
<label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required> <br> <br>
<br> <br>
<label for="pass">Password:</label>
<input type="password" id="pass" name="pass" required>
<br> <br>
<label for="dob">Date of birth:</label>
<input type="date" id="dob" name="dob">
<br> <br>
<label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone">
<br> <br>
<p> GENDER:
 <input type="radio" name="gender" id="male">
 <label for="male">Male</label>
 <input type="radio" name="gender" id="female">
 <label for="female">Female</label>
 </p> <BR> <BR>
  <p>Interests:
<input type="checkbox" id="web">
<label for="web">Web</label>
<input type="checkbox" id="dsa">
<label for="dsa">DSA</label>
</p> <br> <br>
<label for="branch">Branch:</label>
<select id="branch" name="branch">
    <option>BCA</option>
    <option>B.Tech</option>
</select> <br> <br>
<label for="msg">Why do you want to join?</label><br>
 <textarea id="msg" rows="3"></textarea> <br> <br>
 <button type="submit"> Register</button>
  </form>
</body>
</html>
